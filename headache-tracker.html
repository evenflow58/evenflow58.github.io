<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headache Tracker</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif; background: #fdf4ff; color: #1e293b; }
  header { background: linear-gradient(135deg, #a855f7, #ec4899); color: #fff; padding: 36px 20px 28px; text-align: center; border-radius: 0 0 28px 28px; }
  header h1 { margin: 0 0 8px; font-size: 2rem; }
  header p { margin: 0; font-size: 1.05rem; opacity: .94; }
  main { max-width: 640px; margin: 0 auto; padding: 24px 16px 48px; }
  .bigbtn { display: block; width: 100%; border: none; cursor: pointer; background: #fff; border-radius: 24px; box-shadow: 0 6px 20px rgba(30,41,59,.12); padding: 34px 20px 28px; text-align: center; border: 4px solid #e9d5ff; transition: transform .08s ease, border-color .08s ease; }
  .bigbtn:active { transform: scale(.98); }
  .bigbtn .emoji { font-size: 3.4rem; display: block; margin-bottom: 10px; }
  .bigbtn .label { font-size: 1.6rem; font-weight: 800; color: #7e22ce; display: block; }
  .bigbtn .sub { font-size: 1rem; color: #64748b; display: block; margin-top: 8px; }
  .bigbtn.done { border-color: #86efac; background: #f0fdf4; }
  .bigbtn.done .label { color: #15803d; }
  #status { text-align: center; font-size: 1.15rem; font-weight: 700; min-height: 1.6em; margin: 18px 8px 4px; color: #334155; }
  #hint { text-align: center; font-size: .95rem; color: #64748b; margin: 0 8px 8px; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 4px 16px rgba(30,41,59,.08); padding: 20px 18px; margin-top: 22px; }
  .card h2 { margin: 0 0 4px; font-size: 1.2rem; text-align: center; }
  .card .sub2 { text-align: center; color: #64748b; font-size: .92rem; margin: 0 0 14px; }
  table.cal { width: 100%; border-collapse: separate; border-spacing: 4px; table-layout: fixed; }
  table.cal th { font-size: .78rem; color: #94a3b8; font-weight: 700; padding: 2px 0; }
  table.cal td { text-align: center; vertical-align: top; background: #f8fafc; border-radius: 10px; padding: 6px 1px 5px; height: 52px; }
  table.cal td.empty { background: transparent; }
  table.cal td.today { outline: 3px solid #c084fc; background: #faf5ff; }
  table.cal td .d { font-size: .92rem; font-weight: 700; display: block; }
  table.cal td .marks { font-size: .72rem; font-weight: 800; letter-spacing: .02em; display: block; margin-top: 2px; min-height: 1em; }
  .m-morning { color: #d97706; }
  .m-afternoon { color: #2563eb; }
  .m-both { color: #dc2626; }
  .legend { text-align: center; font-size: .9rem; color: #475569; margin-top: 12px; }
  footer { text-align: center; color: #64748b; font-size: .92rem; padding: 0 16px 32px; }
  footer a { color: #7e22ce; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<header>
  <h1>🤕 Headache Tracker</h1>
  <p id="todayLine">Tap the button if your head hurts.</p>
</header>
<main>
  <button class="bigbtn" id="tapBtn" type="button">
    <span class="emoji">🤕</span>
    <span class="label">I have a headache</span>
    <span class="sub" id="periodLine">…</span>
  </button>
  <p id="status"></p>
  <p id="hint">Tap once. It saves the day and whether it is morning or afternoon all by itself.<br>If you tap by mistake, tell a grown-up.</p>

  <h2 style="text-align:center;margin:26px 0 2px;font-size:1.25rem;">Last 30 Days</h2>
  <p style="text-align:center;color:#64748b;font-size:.92rem;margin:0 0 4px;">Headaches recorded on this device</p>
  <div id="calendar"></div>
  <p class="legend"><span class="m-morning">● Morning</span> &nbsp; <span class="m-afternoon">● Afternoon</span> &nbsp; <span class="m-both">● Both</span></p>
</main>
<footer><a href="index.html">&larr; Back to Practice Quizzes</a></footer>

<script>
"use strict";
// Headache Tracker — one tap records Date + Morning/Afternoon to the
// "Headache Tracker" Google Form (same silent-POST pattern as the quizzes)
// and saves a local copy so this page can draw the last-30-days calendar.
var FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSf2tInzodqxcKaiLYm1lULUntAIc7PJXT0atgBdMrHd4JkpnQ/formResponse";
var ENTRY_DATE = "entry.477360009";
var ENTRY_PERIOD = "entry.593175305";
var STORE_KEY = "headache-tracker-v1";
var TZ = "America/New_York";

function nowParts() {
  var fmt = new Intl.DateTimeFormat("en-US", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit", hour: "2-digit", hourCycle: "h23", weekday: "long" });
  var parts = {};
  fmt.formatToParts(new Date()).forEach(function (p) { parts[p.type] = p.value; });
  var dateStr = parts.year + "-" + parts.month + "-" + parts.day;
  var hour = parseInt(parts.hour, 10) % 24;
  return { date: dateStr, hour: hour, period: hour < 12 ? "Morning" : "Afternoon", weekday: parts.weekday };
}
function loadStore() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}"); } catch (e) { return {}; }
}
function saveStore(s) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch (e) {}
}
function datePlus(dateStr, days) {
  var d = new Date(dateStr + "T12:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
function weekdaySun0(dateStr) {
  return new Date(dateStr + "T12:00:00Z").getUTCDay();
}
function render() {
  var np = nowParts();
  var store = loadStore();
  var todayPeriods = store[np.date] || [];
  var already = todayPeriods.indexOf(np.period) >= 0;
  var btn = document.getElementById("tapBtn");
  document.getElementById("todayLine").textContent = "Today is " + np.weekday + ". Tap the button if your head hurts.";
  document.getElementById("periodLine").textContent = already
    ? "Already recorded for this " + np.period.toLowerCase() + " ✓"
    : "Right now counts as " + np.period.toLowerCase() + (np.period === "Morning" ? " ☀️" : " 🌤️");
  btn.classList.toggle("done", already);
  if (!document.getElementById("status").dataset.locked) {
    document.getElementById("status").textContent = already ? "Recorded for this " + np.period.toLowerCase() + " ✓ Hope you feel better 💛" : "";
  }
  // Calendar: the last 30 days shown as real month calendars — one block
  // per month the window touches, with proper weekday alignment.
  var end = np.date;
  var start = datePlus(end, -29);
  var MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
  var html = "";
  var cursor = start.slice(0, 8) + "01";
  while (cursor <= end) {
    var y = parseInt(cursor.slice(0, 4), 10), mo = parseInt(cursor.slice(5, 7), 10);
    var firstDow = weekdaySun0(cursor);
    var dim = new Date(Date.UTC(y, mo, 0)).getUTCDate();
    var cells = [], i;
    for (i = 0; i < firstDow; i++) cells.push(null);
    for (i = 1; i <= dim; i++) {
      var ds = cursor.slice(0, 8) + (i < 10 ? "0" + i : "" + i);
      cells.push(ds >= start && ds <= end ? ds : null);
    }
    while (cells.length % 7 !== 0) cells.push(null);
    // Skip leading/trailing weeks that hold no in-window day.
    while (cells.length && cells.slice(0, 7).every(function (c) { return !c; })) cells = cells.slice(7);
    while (cells.length && cells.slice(-7).every(function (c) { return !c; })) cells = cells.slice(0, -7);
    if (cells.length) {
      html += '<div class="card" style="margin-top:16px;"><h3 style="text-align:center;margin:0 0 8px;font-size:1.1rem;">' + MONTHS[mo - 1] + " " + y + "</h3>";
      html += '<table class="cal"><tr><th>Sun</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th><th>Sat</th></tr>';
      for (i = 0; i < cells.length; i++) {
        if (i % 7 === 0) html += "<tr>";
        var c = cells[i];
        if (!c) { html += '<td class="empty"></td>'; }
        else {
          var periods = store[c] || [];
          var marks = "", cls = "";
          if (periods.length === 2) { marks = "M + A"; cls = "m-both"; }
          else if (periods[0] === "Morning") { marks = "● M"; cls = "m-morning"; }
          else if (periods[0] === "Afternoon") { marks = "● A"; cls = "m-afternoon"; }
          html += '<td class="' + (c === end ? "today" : "") + '"><span class="d">' + parseInt(c.slice(8, 10), 10) + '</span><span class="marks ' + cls + '">' + marks + "</span></td>";
        }
        if (i % 7 === 6) html += "</tr>";
      }
      html += "</table></div>";
    }
    cursor = mo === 12 ? (y + 1) + "-01-01" : cursor.slice(0, 5) + (mo + 1 < 10 ? "0" + (mo + 1) : "" + (mo + 1)) + "-01";
  }
  document.getElementById("calendar").innerHTML = html;
}
function submitToForm(dateStr, period) {
  try {
    var body = new URLSearchParams();
    body.set(ENTRY_DATE, dateStr);
    body.set(ENTRY_PERIOD, period);
    fetch(FORM_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/x-www-form-urlencoded" }, body: body.toString(), keepalive: true }).catch(function () {});
  } catch (e) {}
}
document.getElementById("tapBtn").addEventListener("click", function () {
  var np = nowParts();
  var store = loadStore();
  var periods = store[np.date] || [];
  var status = document.getElementById("status");
  if (periods.indexOf(np.period) >= 0) {
    status.dataset.locked = "1";
    status.textContent = "Already recorded for this " + np.period.toLowerCase() + " — no need to tap again ✓";
    render();
    return;
  }
  periods.push(np.period);
  periods.sort();
  store[np.date] = periods;
  saveStore(store);
  submitToForm(np.date, np.period);
  status.dataset.locked = "1";
  status.textContent = "Got it — recorded for this " + np.period.toLowerCase() + " ✓ Hope you feel better 💛";
  render();
});
render();
</script>
</body>
</html>

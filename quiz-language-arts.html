<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Language Arts Quiz: Cause and Effect &amp; Prefixes</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: ui-rounded, "Segoe UI", system-ui, -apple-system, sans-serif; background: #eef4ff; color: #1e293b; }
  header { background: linear-gradient(135deg, #6d28d9, #db2777); color: #fff; padding: 28px 20px 24px; text-align: center; border-radius: 0 0 28px 28px; }
  header h1 { margin: 0 0 6px; font-size: 1.8rem; }
  header p { margin: 0; font-size: 1.05rem; opacity: .92; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  .card { background: #fff; border-radius: 20px; box-shadow: 0 4px 16px rgba(30, 41, 59, .08); padding: 26px 24px; }
  .btn { display: inline-block; background: #4f46e5; color: #fff; border: none; font: inherit; font-size: 1.2rem; font-weight: 700; padding: 14px 32px; border-radius: 999px; cursor: pointer; box-shadow: 0 4px 0 #312e81; text-decoration: none; }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #312e81; }
  .btn.secondary { background: #e0e7ff; color: #3730a3; box-shadow: 0 4px 0 #a5b4fc; }
  .progress-wrap { background: #e2e8f0; border-radius: 999px; height: 14px; overflow: hidden; margin: 14px 0 6px; }
  .progress-bar { background: linear-gradient(90deg, #4f46e5, #06b6d4); height: 100%; width: 0%; transition: width .3s ease; }
  .progress-label { font-size: .95rem; color: #64748b; font-weight: 600; }
  .question { font-size: 1.3rem; line-height: 1.45; margin: 14px 0 18px; }
  .options { display: grid; gap: 12px; }
  .option { font: inherit; font-size: 1.15rem; text-align: left; padding: 16px 18px; border-radius: 14px; border: 3px solid #e2e8f0; background: #f8fafc; cursor: pointer; width: 100%; }
  .option:hover:not(:disabled) { border-color: #818cf8; }
  .option:disabled { cursor: default; }
  .option.correct { background: #dcfce7; border-color: #22c55e; font-weight: 700; }
  .option.wrong { background: #fee2e2; border-color: #ef4444; }
  .feedback { margin-top: 18px; padding: 14px 16px; border-radius: 14px; font-size: 1.08rem; line-height: 1.45; }
  .feedback.good { background: #f0fdf4; border: 2px solid #86efac; }
  .feedback.bad { background: #fef2f2; border: 2px solid #fca5a5; }
  .next-row { margin-top: 20px; text-align: right; }
  input[type="text"], textarea { font: inherit; font-size: 1.15rem; width: 100%; padding: 14px 16px; border-radius: 14px; border: 3px solid #e2e8f0; background: #f8fafc; }
  input[type="text"]:focus, textarea:focus { outline: none; border-color: #818cf8; background: #fff; }
  .check-row { margin-top: 14px; }
  .stars { font-size: 2.2rem; color: #f59e0b; letter-spacing: .15em; margin: 10px 0; }
  .score-big { font-size: 2rem; font-weight: 800; margin: 6px 0; }
  .center { text-align: center; }
  .home-link { display: inline-block; margin-top: 18px; font-weight: 700; color: #4f46e5; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<header>
  <h1>Language Arts: Cause &amp; Effect</h1>
  <p>Quizzes Fri, Oct 2 &middot; Unit Assessment Fri, Oct 9</p>
</header>
<main>
  <section id="start-screen" class="card center">
    <p style="font-size:1.15rem; line-height:1.5;">10 questions about cause and effect, prefixes, spelling, and story words.<br>Answer each one and you'll find out right away if you got it right!</p>
    <button class="btn" id="start-btn">Start the Quiz</button>
    <br><a class="home-link" href="index.html">&larr; All quizzes</a>
  </section>

  <section id="quiz-screen" class="card" hidden>
    <div class="progress-label" id="progress-label">Question 1 of 10</div>
    <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
    <div class="question" id="question-text"></div>
    <div id="answer-area"></div>
    <div class="feedback" id="feedback" aria-live="polite" hidden></div>
    <div class="next-row"><button class="btn" id="next-btn" hidden>Next Question &rarr;</button></div>
  </section>

  <section id="end-screen" class="card center" hidden>
    <div style="font-size:1.2rem; font-weight:700;">All done!</div>
    <div class="stars" id="stars"></div>
    <div class="score-big" id="score-text"></div>
    <p id="end-message" style="font-size:1.12rem; line-height:1.5;"></p>
    <button class="btn" id="again-btn">Try Again</button>
    <br><a class="home-link" href="index.html">&larr; All quizzes</a>
  </section>
</main>

<script>
const QUESTIONS = [
  { type: "choice", q: "What does <strong>anxious</strong> mean?",
    options: ["Very happy and excited", "Uneasy, worried, or fearful about what may happen", "Ready to run a race", "Tired and sleepy"],
    correct: 1, why: "Anxious means uneasy, worried, or fearful about what may happen." },
  { type: "choice", q: "In the sentence \"The firefighters <strong>seized</strong> the hose,\" what does <strong>seized</strong> mean?",
    options: ["Let go of it", "Washed it", "Grabbed or took hold of it", "Looked at it"],
    correct: 2, why: "Seized means grabbed or took hold of something." },
  { type: "choice", q: "The prefix <strong>non-</strong> means&hellip;",
    options: ["out or former", "not or without", "again", "very big"],
    correct: 1, why: "Non- means \"not\" or \"without\" &mdash; like nonfiction and nonstop." },
  { type: "choice", q: "What does the word <strong>exhale</strong> mean?",
    options: ["To hold your breath", "To breathe out", "To breathe in deeply", "To stop breathing"],
    correct: 1, why: "Ex- means \"out,\" so exhale means to breathe out." },
  { type: "choice", q: "True or False: The prefix <strong>ex-</strong> can mean \"former,\" so an \"ex-teammate\" is someone who is no longer on the team.",
    options: ["True", "False"],
    correct: 0, why: "True! Ex- can mean \"former\" &mdash; an ex-teammate used to be on the team." },
  { type: "choice", q: "\"It rained all night long, ___________ the soccer game was canceled.\" Which words best complete the sentence?",
    options: ["before", "because", "as a result", "instead"],
    correct: 2, why: "\"As a result\" shows the effect that happened because of a cause." },
  { type: "choice", q: "Read this sentence: \"Ben missed the bus <strong>because</strong> he overslept.\" What is the <strong>cause</strong>?",
    options: ["Ben missed the bus", "Ben overslept", "The bus", "School started"],
    correct: 1, why: "The cause is WHY something happened: Ben overslept." },
  { type: "choice", q: "Which word is spelled correctly?",
    options: ["gentel", "gentle", "gentil", "jentle"],
    correct: 1, why: "The correct spelling is g-e-n-t-l-e: gentle." },
  { type: "choice", q: "Read this sentence: \"Maria studied hard for the test, so she felt ready on Friday.\" What is the <strong>effect</strong>?",
    options: ["Maria studied hard", "The test was on Friday", "Maria felt ready", "The test was difficult"],
    correct: 2, why: "The effect is what happened as a result: Maria felt ready." },
  { type: "selfcheck", q: "Finish this cause-and-effect sentence with an ending of your own: \"I was very thirsty because&hellip;\"",
    sample: "&hellip;because I played outside in the hot sun. (Any true reason works!)",
    why: "Your ending should tell WHY you were thirsty &mdash; that's the cause." }
];

const startScreen = document.getElementById("start-screen");
const quizScreen = document.getElementById("quiz-screen");
const endScreen = document.getElementById("end-screen");
const qText = document.getElementById("question-text");
const answerArea = document.getElementById("answer-area");
const feedback = document.getElementById("feedback");
const nextBtn = document.getElementById("next-btn");
const progressLabel = document.getElementById("progress-label");
const progressBar = document.getElementById("progress-bar");
let idx = 0, score = 0;

function shuffle(arr) {
  const a = arr.slice();
  for (let j = a.length - 1; j > 0; j--) {
    const k = Math.floor(Math.random() * (j + 1));
    [a[j], a[k]] = [a[k], a[j]];
  }
  return a;
}

function startQuiz() {
  idx = 0; score = 0;
  startScreen.hidden = true;
  endScreen.hidden = true;
  quizScreen.hidden = false;
  renderQuestion();
}

function showFeedback(ok, why) {
  feedback.hidden = false;
  feedback.className = "feedback " + (ok ? "good" : "bad");
  feedback.innerHTML = (ok ? "<strong>That's right!</strong> " : "<strong>Not quite.</strong> ") + why;
}

function finishQuestion() {
  nextBtn.hidden = false;
  nextBtn.textContent = (idx === QUESTIONS.length - 1) ? "See My Score \u2192" : "Next Question \u2192";
  nextBtn.focus();
}

function renderQuestion() {
  const item = QUESTIONS[idx];
  progressLabel.textContent = "Question " + (idx + 1) + " of " + QUESTIONS.length;
  progressBar.style.width = ((idx / QUESTIONS.length) * 100) + "%";
  qText.innerHTML = item.q;
  feedback.hidden = true;
  nextBtn.hidden = true;
  answerArea.innerHTML = "";

  if (item.type === "choice") {
    const wrap = document.createElement("div");
    wrap.className = "options";
    const order = shuffle(item.options.map(function (_, i) { return i; }));
    order.forEach(function (origIdx) {
      const btn = document.createElement("button");
      btn.className = "option";
      btn.innerHTML = item.options[origIdx];
      btn.addEventListener("click", function () {
        const all = wrap.querySelectorAll(".option");
        all.forEach(function (b) { b.disabled = true; });
        const ok = origIdx === item.correct;
        if (ok) { score++; btn.classList.add("correct"); }
        else {
          btn.classList.add("wrong");
          all.forEach(function (b) { if (b.innerHTML === item.options[item.correct]) b.classList.add("correct"); });
        }
        showFeedback(ok, item.why);
        finishQuestion();
      });
      wrap.appendChild(btn);
    });
    answerArea.appendChild(wrap);
  } else if (item.type === "text") {
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Type your answer here";
    input.setAttribute("aria-label", "Your answer");
    const row = document.createElement("div");
    row.className = "check-row";
    const checkBtn = document.createElement("button");
    checkBtn.className = "btn";
    checkBtn.textContent = "Check My Answer";
    row.appendChild(checkBtn);
    answerArea.appendChild(input);
    answerArea.appendChild(row);
    const norm = function (s) { return s.toLowerCase().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim(); };
    checkBtn.addEventListener("click", function () {
      if (!input.value.trim()) { input.focus(); return; }
      const ok = item.accept.map(norm).indexOf(norm(input.value)) !== -1;
      if (ok) score++;
      input.disabled = true;
      checkBtn.disabled = true;
      showFeedback(ok, item.why + (ok ? "" : " The answer is: <strong>" + item.display + "</strong>"));
      finishQuestion();
    });
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") checkBtn.click(); });
    input.focus();
  } else if (item.type === "selfcheck") {
    const ta = document.createElement("textarea");
    ta.rows = 3;
    ta.placeholder = "Type (or say out loud) your answer";
    ta.setAttribute("aria-label", "Your answer");
    const row = document.createElement("div");
    row.className = "check-row";
    const showBtn = document.createElement("button");
    showBtn.className = "btn";
    showBtn.textContent = "Show a Sample Answer";
    row.appendChild(showBtn);
    answerArea.appendChild(ta);
    answerArea.appendChild(row);
    showBtn.addEventListener("click", function () {
      showBtn.disabled = true;
      ta.disabled = true;
      feedback.hidden = false;
      feedback.className = "feedback good";
      feedback.innerHTML = "<strong>Sample answer:</strong> " + item.sample + "<br><br>" + item.why;
      const judge = document.createElement("div");
      judge.className = "check-row";
      const gotIt = document.createElement("button");
      gotIt.className = "btn";
      gotIt.textContent = "I got it!";
      const keepBtn = document.createElement("button");
      keepBtn.className = "btn secondary";
      keepBtn.textContent = "Keep practicing";
      keepBtn.style.marginLeft = "10px";
      judge.appendChild(gotIt);
      judge.appendChild(keepBtn);
      answerArea.appendChild(judge);
      gotIt.addEventListener("click", function () { score++; gotIt.disabled = true; keepBtn.disabled = true; finishQuestion(); });
      keepBtn.addEventListener("click", function () { gotIt.disabled = true; keepBtn.disabled = true; finishQuestion(); });
    });
    ta.focus();
  }
}

function showEnd() {
  quizScreen.hidden = true;
  endScreen.hidden = false;
  progressBar.style.width = "100%";
  const total = QUESTIONS.length;
  document.getElementById("score-text").textContent = "You got " + score + " out of " + total + "!";
  const stars = document.getElementById("stars");
  const msg = document.getElementById("end-message");
  if (score === total) { stars.textContent = "\u2605\u2605\u2605"; msg.textContent = "Perfect score! You are ready for the test. Amazing work!"; }
  else if (score >= total - 2) { stars.textContent = "\u2605\u2605\u2606"; msg.textContent = "Great job! Look back at the ones you missed and you'll have them down in no time."; }
  else if (score >= Math.ceil(total / 2)) { stars.textContent = "\u2605\u2606\u2606"; msg.textContent = "Good work! Try the quiz again, or look at the study guide, and watch your score grow."; }
  else { stars.textContent = "\u2606\u2606\u2606"; msg.textContent = "Good try! Read through the study guide, then take the quiz again. You'll get it!"; }
}

document.getElementById("start-btn").addEventListener("click", startQuiz);
document.getElementById("again-btn").addEventListener("click", startQuiz);
nextBtn.addEventListener("click", function () {
  idx++;
  if (idx >= QUESTIONS.length) showEnd(); else renderQuestion();
});
</script>
</body>
</html>
